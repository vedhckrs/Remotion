<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remotion Control Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23111%27/%3E%3Cpath d=%27M12 9l12 7-12 7z%27 fill=%27%234ade80%27/%3E%3C/svg%3E">
<style>
  :root { --bg:#0b0b0f; --panel:#14141b; --panel2:#1b1b24; --line:#262633; --text:#f5f5f7; --muted:#9a9aa6; --dim:#6d6d7a; --accent:#7c5cff; --accent2:#22d3ee; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, Inter, system-ui, sans-serif; overflow:hidden; }
  .app { display:flex; flex-direction:column; height:100vh; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 11px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.small { padding:4px 9px; font-size:12px; }
  button.ghost { background:none; border-color:transparent; color:var(--muted); padding:4px 6px; }
  button.ghost:hover { color:var(--text); border-color:var(--line); }
  button.danger { color:#fca5a5; }
  select, input[type=text], textarea { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font:inherit; width:100%; min-width:0; }
  textarea { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; min-height:280px; resize:vertical; }
  a { color:var(--accent2); }
  .muted { color:var(--muted); } .dim { color:var(--dim); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .row > * { flex:1; } .row > button, .row > label.check, .row > a, .row > .fixed, .row > small { flex:0 0 auto; }
  label.check { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:13px; cursor:pointer; }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:#2e2e3b; border-radius:6px; border:2px solid var(--panel); } ::-webkit-scrollbar-track { background:transparent; }

  /* header */
  header.top { flex:none; display:flex; gap:10px 22px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .brand { display:flex; gap:10px; align-items:center; min-width:0; max-width:270px; } .brand > div { min-width:0; }
  .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none; }
  .brand b { display:block; font-size:15px; } .brand small { color:var(--muted); font-size:11.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gauges { display:flex; gap:14px; }
  .gauge { display:flex; flex-direction:column; min-width:84px; }
  .gauge label, .hlabel { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }
  .gauge b { font-weight:600; font-size:12.5px; white-space:nowrap; }
  .bar { height:5px; background:var(--line); border-radius:4px; overflow:hidden; margin:3px 0 2px; }
  .bar i { display:block; height:100%; background:var(--accent); transition:width .4s; }
  .bar i.warn { background:var(--warn); } .bar i.bad { background:var(--bad); } .bar i.ok { background:var(--ok); }
  .speed { display:flex; flex-direction:column; gap:3px; min-width:240px; max-width:340px; flex:1; }
  .speed .line { display:flex; gap:8px; align-items:center; }
  .speed input[type=range] { flex:1; accent-color:var(--accent); }
  .toggles { display:flex; gap:14px; align-items:center; margin-left:auto; }
  .toggles .stack { display:flex; flex-direction:column; gap:2px; } .toggles label.check { font-size:12.5px; }

  /* tabs */
  nav.tabs { flex:none; display:flex; align-items:center; gap:2px; padding:0 18px; border-bottom:1px solid var(--line); }
  nav.tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:11px 14px; color:var(--muted); font-weight:600; }
  nav.tabs button:hover { color:var(--text); }
  nav.tabs button.on { color:var(--text); border-bottom-color:var(--accent); }
  .qpill { margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; min-width:0; }
  .qpill span:first-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:420px; }
  .mini { width:90px; height:5px; background:var(--line); border-radius:3px; overflow:hidden; flex:none; } .mini i { display:block; height:100%; background:var(--accent); }

  /* layout: the page never scrolls, panels do */
  main.views { flex:1; min-height:0; }
  .view { display:none; height:100%; padding:14px 18px; }
  .view.on { display:flex; flex-direction:column; gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-height:0; min-width:0; }
  .panel-head { flex:none; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); min-height:46px; }
  .panel-head h2 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel-body { flex:1; min-height:0; overflow:auto; padding:12px 14px; }
  .col { display:flex; flex-direction:column; gap:12px; min-height:0; min-width:0; }
  .grow { flex:1; }
  .empty { color:var(--muted); font-size:13px; padding:6px 0; }
  .log { flex:1; min-height:0; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px; background:#07070a; border:1px solid var(--line); border-radius:10px; margin:0 12px 12px; padding:10px; overflow:auto; white-space:pre-wrap; color:#c8c8d0; }
  .log .src { color:var(--accent2); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:4px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:12px; color:var(--muted); }
  .chip:hover { color:var(--text); } .chip.on { border-color:var(--accent); background:rgba(124,92,255,.18); color:var(--text); }
  .status { font-size:10.5px; padding:2px 8px; border-radius:6px; background:var(--line); text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; color:var(--muted); }
  .status.rendering, .status.running, .status.bundling, .status.selecting, .status.queued { background:rgba(124,92,255,.22); color:#c9bcff; }
  .status.done { background:rgba(34,197,94,.18); color:#86efac; } .status.failed { background:rgba(239,68,68,.2); color:#fca5a5; } .status.cancelled { background:rgba(245,158,11,.2); color:#fcd34d; }
  .progress { height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:8px; } .progress i { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .item { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .item + .item { margin-top:8px; }
  .item .top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .item .top b { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fixed { flex:none; white-space:nowrap; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--line); font-size:11px; margin:0 4px 4px 0; color:var(--muted); }
  .pill.ok { background:rgba(34,197,94,.16); color:#86efac; }

  /* episodes */
  .strip { flex:none; display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; align-items:stretch; }
  .strip .month { flex:0 0 auto; align-self:center; font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; padding:0 4px 0 8px; }
  .wk, .ept { flex:0 0 auto; text-align:left; padding:7px 11px; border-radius:10px; }
  .wk { width:150px; } .ept { width:200px; }
  .wk b, .ept b { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .wk small, .ept small { display:block; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wk.on, .ept.on { border-color:var(--accent); background:rgba(124,92,255,.14); }
  .meter { height:3px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden; } .meter i { display:block; height:100%; background:var(--ok); }
  .planline { flex:none; display:flex; gap:10px; align-items:baseline; }
  .planline b { font-size:15px; }
  .ep-main { flex:1; min-height:0; display:grid; grid-template-columns: minmax(0, 1fr) 380px; gap:12px; }
  .ep-title { font-size:20px; font-weight:700; letter-spacing:-.01em; margin:2px 0 14px; }
  .vid { display:grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap:12px; align-items:center; padding:12px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; }
  .vid + .vid { margin-top:8px; }
  .vid.off { opacity:.5; }
  .vid input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); }
  .vid .name { display:flex; gap:8px; align-items:center; font-weight:600; }
  .vid .name small { color:var(--muted); font-weight:400; }
  .vid .ttl { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .vid .right { display:flex; gap:10px; align-items:center; }
  .ratio { font-size:12px; padding:4px 10px; border-radius:7px; color:var(--muted); } .ratio.on { border-color:var(--accent); background:rgba(124,92,255,.2); color:var(--text); }
  .tag { font-size:12px; padding:4px 10px; border-radius:7px; border:1px solid var(--line); color:var(--muted); }
  .st { font-size:11px; padding:3px 8px; border-radius:6px; white-space:nowrap; background:var(--line); color:var(--muted); min-width:86px; text-align:center; }
  .st.script { background:rgba(245,158,11,.16); color:#fcd34d; } .st.voiced { background:rgba(34,211,238,.14); color:#67e8f9; } .st.rendered { background:rgba(124,92,255,.2); color:#c9bcff; } .st.saved { background:rgba(34,197,94,.16); color:#86efac; } .st.working { background:rgba(124,92,255,.32); color:#fff; }
  .opts { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:8px; margin-top:14px; }
  details.more { margin-top:10px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  details.more summary { cursor:pointer; color:var(--muted); font-size:13px; }
  details.more[open] summary { margin-bottom:10px; }
  .savebar { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:12.5px; color:var(--muted); }
  .savebar span { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .go { width:100%; margin-top:12px; padding:11px; font-size:15px; }
  .job-now { font-size:12px; color:#c9bcff; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  details.steps summary { cursor:pointer; font-size:12px; color:var(--muted); margin-top:6px; }
  .steps .s { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; }
  .steps .s.done, .steps .s.skipped { color:#86efac; } .steps .s.running { color:#c9bcff; font-weight:600; } .steps .s.failed { color:#fca5a5; }
  .steps .s small { color:var(--dim); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%; }

  /* upload details */
  .upbar { flex:none; display:flex; gap:8px; align-items:center; }
  .upbar select { width:auto; max-width:340px; }
  .up-list { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:12px; padding-right:2px; }
  .up-list > .panel { flex-shrink:0; }
  .up-card { display:grid; grid-template-columns: 300px minmax(0, 1fr); }
  .up-card .media { padding:12px; border-right:1px solid var(--line); }
  .up-card .copy { padding:12px 14px; min-width:0; }
  .tabs2 { display:flex; gap:4px; align-items:center; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .tabs2 button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:7px 10px; color:var(--muted); font-size:13px; font-weight:600; }
  .tabs2 button.on { color:var(--text); border-bottom-color:var(--accent); }
  .tabs2 button.small { border:1px solid var(--line); border-radius:8px; margin-bottom:4px; }
  .tabs2 .sp { flex:1; }
  .field { margin-bottom:10px; } .field label { display:flex; justify-content:space-between; align-items:center; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px; }
  .field .val { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; white-space:pre-wrap; word-break:break-word; font-size:13px; max-height:220px; overflow:auto; }
  .copied { color:var(--ok) !important; border-color:var(--ok) !important; }
  @media (max-width:1100px) { .up-card { grid-template-columns:1fr; } .up-card .media { border-right:none; border-bottom:1px solid var(--line); } }

  /* media frames: fixed sizes, never stretch the layout */
  .player { background:#000; border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .player.v { height:420px; } .player.h { aspect-ratio:16/9; } .player.sq { aspect-ratio:1; }
  .player video { max-width:100%; max-height:100%; display:block; }
  .thumbs { display:flex; gap:6px; margin-top:8px; }
  .thumbs a { flex:1; display:block; height:64px; background:#000; border-radius:6px; overflow:hidden; border:1px solid var(--line); }
  .thumbs img { width:100%; height:100%; object-fit:contain; }

  /* outputs gallery */
  .group { margin-bottom:16px; }
  .group h3 { margin:0 0 8px; font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.03em; }
  .gallery { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px; align-items:start; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card .frame { position:relative; background:#000; cursor:pointer; aspect-ratio:16/9; }
  .card.short .frame, .card.img-v .frame { aspect-ratio:9/16; }
  .card.feed .frame, .card.img-sq .frame { aspect-ratio:1; }
  .card .frame img, .card .frame video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .card .frame .play { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center; font-size:13px; }
  .card .frame .badge { position:absolute; left:6px; top:6px; font-size:10px; padding:1px 6px; border-radius:5px; background:rgba(0,0,0,.65); color:#fff; }
  .card .meta { padding:7px 9px 4px; font-size:11.5px; min-width:0; }
  .card .meta b { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .acts { display:flex; gap:4px; padding:0 9px 9px; }
  .card .acts button { padding:3px 7px; font-size:11px; }
  .cr-grid { flex:1; min-height:0; display:grid; grid-template-columns: 300px minmax(0, 1fr) 360px; gap:12px; }

  /* modals */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
  .modal.on { display:flex; }
  .modal .box { background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(680px, 96vw); max-height:90vh; display:flex; flex-direction:column; padding:14px 16px; gap:8px; }
  .modal .box.wide { width:min(960px, 96vw); }
  .modal .entries { overflow:auto; flex:1; border:1px solid var(--line); border-radius:8px; min-height:220px; }
  .modal .entries div { padding:7px 10px; cursor:pointer; border-bottom:1px solid var(--line); font-size:13px; } .modal .entries div:hover { background:var(--panel2); }
  .modal .stage { background:#000; border-radius:10px; display:flex; align-items:center; justify-content:center; height:min(74vh, 900px); }
  .modal .stage video, .modal .stage img { max-width:100%; max-height:100%; }

  @media (max-width:1180px) {
    body { overflow:auto; } .app { height:auto; min-height:100vh; } .view { height:auto; }
    .ep-main, .cr-grid { grid-template-columns:1fr; } .panel-body { max-height:75vh; } .log { height:240px; flex:none; }
  }
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="dot"></span><div><b>Remotion Control Room</b><small id="project"></small></div></div>
  <div class="gauges">
    <div class="gauge"><label>CPU</label><div class="bar"><i id="g-load"></i></div><b id="t-load">–</b></div>
    <div class="gauge" title="Memory apps can use now (free + cache), as Activity Monitor counts it"><label>Memory</label><div class="bar"><i id="g-mem"></i></div><b id="t-mem">–</b></div>
    <div class="gauge" title="macOS thermal state. Hot means the Mac is slowing itself down to cool off"><label>Thermal</label><div class="bar"><i id="g-therm"></i></div><b id="t-therm">–</b></div>
    <div class="gauge"><label>Disk free</label><div class="bar"><i id="g-disk" class="ok" style="width:100%"></i></div><b id="t-disk">–</b></div>
  </div>
  <div class="speed">
    <div class="line"><span class="hlabel">Budget</span><input type="range" id="budget" min="10" max="100" step="5" /><b id="t-budget">–</b></div>
    <div class="line"><small class="muted" id="t-conc" style="flex:1"></small><button class="small" id="full-speed" title="Budget 100 %, hardware encoder on">Full speed</button><button class="small" id="speed-test" title="Times 2 s of video with different tab counts and keeps the fastest">Speed test</button></div>
  </div>
  <div class="toggles">
    <div class="stack">
      <label class="check" title="Capture at scale 2: 3840x2160 / 2160x3840"><input type="checkbox" id="fourk" /> 4K master</label>
      <label class="check"><input type="checkbox" id="hw" /> <span id="t-hw">HW encoder</span></label>
    </div>
    <span class="check"><button class="small" id="studio-btn">Start Studio</button><a id="studio-link" href="#" target="_blank" style="display:none">open</a></span>
  </div>
</header>

<nav class="tabs">
  <button data-view="episodes" class="on">Episodes</button>
  <button data-view="upload">Upload details</button>
  <button data-view="control">Control room</button>
  <span class="qpill" id="qpill"></span>
</nav>

<main class="views">
  <section class="view on" id="view-episodes">
    <div class="planline"><b id="plan-title">Content plan</b><button class="ghost small" id="plan-choose">Choose plan…</button><small class="muted" id="plan-error"></small></div>
    <div class="strip" id="weeks"></div>
    <div class="strip" id="eps"></div>
    <div class="ep-main">
      <div class="panel">
        <div class="panel-head"><h2 id="ep-head">Episode</h2><span class="fixed"><button class="small" id="ep-open">Open folder</button> <button class="small" id="ep-up">Upload details</button></span></div>
        <div class="panel-body" id="ep-detail"><div class="empty">Pick a week, then an episode.</div></div>
      </div>
      <div class="col">
        <div class="panel grow"><div class="panel-head"><h2>Progress</h2><small class="muted">one video at a time</small></div><div class="panel-body" id="ep-jobs"></div></div>
        <div class="panel" style="height:30%"><div class="panel-head"><h2>Log</h2></div><div class="log" id="log2"></div></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-upload">
    <div class="upbar">
      <select id="up-week"></select>
      <select id="up-ep"></select>
      <span style="flex:1"></span>
      <button class="small" id="up-refresh">Refresh</button>
      <a id="up-md" href="#"><button class="small">Download .md</button></a>
      <button class="small" id="up-open">Open saved folder</button>
    </div>
    <div class="up-list" id="up-body"><div class="empty">Pick an episode.</div></div>
  </section>

  <section class="view" id="view-control">
    <div class="cr-grid">
      <div class="col">
        <div class="panel grow">
          <div class="panel-head"><h2>Scripts</h2><button class="small" id="new-script">New from text</button></div>
          <div class="panel-body" id="scripts"></div>
        </div>
        <div class="panel" style="max-height:34%">
          <div class="panel-head"><h2>Autopilot</h2><span class="fixed"><button class="small" id="ap-plan">Plan</button> <button class="small" id="ap-run">Produce</button> <button class="small" id="ap-due">Publish due</button></span></div>
          <div class="panel-body" id="autopilot"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Outputs</h2><div class="chips" id="out-filter" style="flex:1;justify-content:center"></div><button class="small" id="refresh-out">Refresh</button></div>
        <div class="panel-body" id="outputs"></div>
      </div>
      <div class="col">
        <div class="panel" style="flex:none">
          <div class="panel-head"><h2>Render</h2><button class="small" id="refresh-comps">Refresh</button></div>
          <div class="panel-body" style="overflow:visible">
            <div class="row"><select id="comp"></select><input type="text" id="frames" placeholder="frames, e.g. 0-300" /></div>
            <div class="chips" id="presets" style="margin-bottom:8px"></div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
let S = {settings: {}, machine: {}, compositions: [], scripts: [], jobs: [], outputs: [], studio: {}};
let P = {weeks: []};
let D = null;
let view = 'episodes';
let selWeek = null, selEp = null;
let preset = 'shorts';
let outFilter = 'all';
const FORMS = {};
const COPY = [];
const UPTAB = {};
const PRESET_LIST = ['shorts', 'reels', 'stories', 'facebook', 'feed', 'youtube-1080p', 'preview'];
const PLATFORM_FOR_COMP = {Shorts: 'shorts', Reels: 'reels', Stories: 'stories', Facebook: 'facebook', Feed: 'feed', YouTube: 'youtube-1080p'};
const VARIANT_LABEL = {long: 'Long video', 'short-a': 'Short A', 'short-b': 'Short B'};
const ACTIVE = ['queued', 'bundling', 'selecting', 'rendering', 'running'];
const RUNNING = ['bundling', 'selecting', 'rendering', 'running'];

const api = async (path, method = 'GET', body) => {
  try {
    const res = await fetch(path, {method, headers: {'Content-Type': 'application/json', 'X-Dashboard': '1'}, body: body ? JSON.stringify(body) : undefined});
    const text = await res.text();
    try { return JSON.parse(text); } catch { return {error: text || res.statusText}; }
  } catch (error) { return {error: 'Dashboard not reachable: ' + error.message}; }
};
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmtBytes = (b) => b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB';
const fmtTime = (s) => s == null ? '' : s > 3600 ? Math.round(s / 360) / 10 + ' h' : s > 90 ? Math.round(s / 60) + ' min' : s + ' s';
const fmtDate = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'}) : '';
const outUrl = (f) => '/out/' + String(f).split('/').map(encodeURIComponent).join('/');
const store = {get(k, d) { try { const v = localStorage.getItem('rcr.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('rcr.' + k, JSON.stringify(v)); } catch {} }};

// ---------------- header ----------------
function renderMachine() {
  const m = S.machine; if (!m || !m.cores) return;
  $('#project').textContent = `${S.project || ''} · ${m.chip || m.platform} · ${m.cores} cores · ${m.memoryGb} GB`;
  const load = $('#g-load'); load.style.width = m.loadPercent + '%'; load.className = m.loadPercent > 85 ? 'bad' : m.loadPercent > 60 ? 'warn' : '';
  $('#t-load').textContent = `${m.loadPercent}% (${m.load1})`;
  const memPct = Math.max(0, Math.min(100, Math.round((m.freeMemoryGb / m.memoryGb) * 100)));
  const mem = $('#g-mem'); mem.style.width = memPct + '%'; mem.className = memPct < 10 ? 'bad' : memPct < 20 ? 'warn' : 'ok';
  $('#t-mem').textContent = `${m.freeMemoryGb} GB`;
  const th = m.thermal; const bar = $('#g-therm');
  if (!th) { bar.style.width = '0%'; $('#t-therm').textContent = 'n/a'; }
  else {
    bar.style.width = [100, 70, 40, 15][th.level] + '%';
    bar.className = th.level === 0 ? 'ok' : th.level === 1 ? 'warn' : 'bad';
    $('#t-therm').textContent = {normal: 'Normal', warm: 'Warm', hot: 'Hot · slowing', critical: 'Critical'}[th.state] || th.state;
  }
  $('#t-disk').textContent = m.freeDiskGb == null ? '–' : `${m.freeDiskGb} GB`;
  $('#g-disk').className = m.freeDiskGb != null && m.freeDiskGb < 30 ? 'warn' : 'ok';
  const fourK = !!S.settings.fourK; const tested = S.settings?.tested?.[fourK ? 'fourK' : 'hd'];
  $('#t-conc').textContent = `${fourK ? '4K' : '1080p'}: ${fourK ? m.recommendedConcurrency4k : m.recommendedConcurrency} tabs${tested && S.settings.budget >= 100 ? ' · tested' : ''}`;
  $('#t-hw').textContent = m.hardwareEncoder ? `HW encoder (${m.hardwareEncoder})` : 'HW encoder (n/a)';
  $('#hw').disabled = !m.hardwareEncoder;
}
function renderSettings() {
  $('#budget').value = S.settings.budget ?? 50; $('#t-budget').textContent = (S.settings.budget ?? 50) + '%';
  $('#hw').checked = !!S.settings.hw; $('#fourk').checked = !!S.settings.fourK;
  $('#render-hint').textContent = `${preset} · ${S.settings.fourK ? '4K master' : 'native size'} · ${S.settings.hw && S.machine.hardwareEncoder ? S.machine.hardwareEncoder : 'x264'} · gl=${S.settings.gl || ''}`;
}
async function saveSettings(patch) { const r = await api('/api/settings', 'POST', patch); if (r.settings) { S.settings = r.settings; S.machine = r.machine || S.machine; } renderMachine(); renderSettings(); }
$('#budget').oninput = () => { $('#t-budget').textContent = $('#budget').value + '%'; };
$('#budget').onchange = () => saveSettings({budget: Number($('#budget').value)});
$('#hw').onchange = () => saveSettings({hw: $('#hw').checked});
$('#fourk').onchange = () => saveSettings({fourK: $('#fourk').checked});
$('#full-speed').onclick = () => saveSettings({budget: 100, hw: Boolean(S.machine.hardwareEncoder)});
$('#speed-test').onclick = async () => {
  if (!confirm(`Speed test renders 2 seconds of video ${S.settings.fourK ? 'in 4K ' : ''}with 2 to ${S.machine.cores} tabs (about 3 to 8 minutes) and keeps the fastest as your Full speed setting. Close other heavy apps first. Start?`)) return;
  await api('/api/speedtest', 'POST', {fourK: S.settings.fourK});
};
function renderStudio() {
  $('#studio-btn').textContent = S.studio?.running ? 'Stop Studio' : 'Start Studio';
  const a = $('#studio-link'); if (S.studio?.url) { a.href = S.studio.url; a.style.display = 'inline'; } else a.style.display = 'none';
}
$('#studio-btn').onclick = async () => { const r = await api('/api/studio', 'POST', {action: S.studio?.running ? 'stop' : 'start'}); if (!r.error) { S.studio = r; renderStudio(); } };

// ---------------- tabs + queue pill ----------------
function setView(v) {
  if (!['episodes', 'upload', 'control'].includes(v)) v = 'episodes';
  view = v; store.set('view', v);
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('.view').forEach(el => el.classList.toggle('on', el.id === 'view-' + v));
  if (v === 'upload') { syncUploadSelectors(); loadDetails(); }
}
$$('nav.tabs button').forEach(b => b.onclick = () => setView(b.dataset.view));
function jobName(j) {
  if (j.title) return j.title;
  if (j.kind === 'render') return `${j.compositionId} · ${j.preset}${j.fourK ? ' · 4K' : ''}`;
  return `${j.task || j.kind} ${j.options?.videoId || ''}`.trim();
}
function renderQueuePill() {
  const active = S.jobs.find(j => RUNNING.includes(j.status));
  const waiting = S.jobs.filter(j => j.status === 'queued').length;
  if (!active && !waiting) { $('#qpill').innerHTML = ''; return; }
  const pct = active ? Math.round((active.progress || 0) * 100) : 0;
  $('#qpill').innerHTML = active ? `<span>▸ ${esc(jobName(active))} · ${pct}%${waiting ? ` · ${waiting} waiting` : ''}</span><span class="mini"><i style="width:${pct}%"></i></span>` : `<span>${waiting} waiting</span>`;
}

// ---------------- episodes ----------------
const allEpisodes = () => (P.weeks || []).flatMap(w => w.episodes.map(ep => ({...ep, week: w})));
const findEp = (id) => allEpisodes().find(e => e.id === id);
const epDone = (ep) => ep.videos.filter(v => v.status.rendered && v.status.pack).length;
function jobFor(epId, variant) {
  return S.jobs.find(j => j.kind === 'episode' && ACTIVE.includes(j.status) && j.options?.episodeId === epId && j.options?.videos?.[0]?.variant === variant);
}
function videoState(ep, v) {
  const j = jobFor(ep.id, v.variant);
  if (j) return j.status === 'queued' ? {cls: 'working', text: 'Queued'} : {cls: 'working', text: `Working ${Math.round((j.progress || 0) * 100)}%`};
  const st = v.status;
  if (st.exported) return {cls: 'saved', text: 'Saved'};
  if (st.rendered) return {cls: 'rendered', text: 'Rendered'};
  if (st.voice) return {cls: 'voiced', text: 'Voiced'};
  if (st.script || st.md) return {cls: 'script', text: 'Script ready'};
  return {cls: '', text: 'No script yet'};
}
async function loadPlan() { const r = await api('/api/plan'); if (r && (r.weeks || r.error)) P = {weeks: [], ...r}; renderPlan(); }
function renderPlan() {
  $('#plan-title').textContent = P.title || 'Content plan';
  $('#plan-choose').textContent = P.weeks?.length ? 'Change plan' : 'Choose plan…';
  $('#plan-choose').title = P.file || '';
  $('#plan-error').textContent = P.error || '';
  if (!P.weeks?.length) {
    $('#weeks').innerHTML = ''; $('#eps').innerHTML = '';
    $('#ep-detail').innerHTML = '<div class="empty">No plan loaded. Click "Choose plan…" and pick your season JSON (Tech/01-plan/season-1.json).</div>';
    $('#ep-head').textContent = 'Episode';
    syncUploadSelectors();
    return;
  }
  if (selWeek == null) selWeek = store.get('week', P.weeks[0].number);
  if (!P.weeks.find(w => w.number === selWeek)) selWeek = P.weeks[0].number;
  let lastMonth = null;
  $('#weeks').innerHTML = P.weeks.map(w => {
    const month = w.start ? new Date(w.start + 'T12:00:00').toLocaleString(undefined, {month: 'short'}) : '';
    const sep = month && month !== lastMonth ? `<span class="month">${esc(month)}</span>` : ''; lastMonth = month;
    const total = w.episodes.reduce((n, e) => n + e.videos.length, 0); const done = w.episodes.reduce((n, e) => n + epDone(e), 0);
    return `${sep}<button class="wk ${w.number === selWeek ? 'on' : ''}" data-week="${w.number}" title="${esc(w.title || '')}"><b>W${w.number} · ${esc(w.title || '')}</b><small>${esc(fmtDate(w.start))}</small><div class="meter"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div></button>`;
  }).join('');
  $$('#weeks [data-week]').forEach(b => b.onclick = () => { selWeek = Number(b.dataset.week); store.set('week', selWeek); selEp = null; renderPlan(); });
  const w = P.weeks.find(x => x.number === selWeek);
  if (!selEp || !w.episodes.find(e => e.id === selEp)) selEp = store.get('ep.' + selWeek, w.episodes[0]?.id);
  if (!w.episodes.find(e => e.id === selEp)) selEp = w.episodes[0]?.id;
  $('#eps').innerHTML = w.episodes.map(ep => `<button class="ept ${ep.id === selEp ? 'on' : ''}" data-ep="${esc(ep.id)}" title="${esc(ep.topic)}"><b>${esc(ep.id.toUpperCase())} · ${esc(ep.topic)}</b><small>${esc(fmtDate(ep.date))} · ${epDone(ep)}/${ep.videos.length} ready</small></button>`).join('');
  $$('#eps [data-ep]').forEach(b => b.onclick = () => { selEp = b.dataset.ep; store.set('ep.' + selWeek, selEp); renderPlan(); });
  $('#eps .ept.on')?.scrollIntoView({block: 'nearest', inline: 'nearest'});
  $('#weeks .wk.on')?.scrollIntoView({block: 'nearest', inline: 'nearest'});
  renderDetail();
  syncUploadSelectors();
}
function formFor(ep) {
  if (!FORMS[ep.id]) {
    const saved = store.get('form', {});
    FORMS[ep.id] = {
      videos: Object.fromEntries(ep.videos.map(v => [v.variant, {on: true, ratios: [...(v.ratios || [])]}])),
      outDir: ep.exportDir || '',
      voiceProvider: saved.voiceProvider || S.settings.voiceProvider || 'elevenlabs',
      music: saved.music || S.settings.music || 'library',
      writer: saved.writer || S.settings.writer || 'claude',
      writerModel: saved.writerModel || S.settings.writerModel || 'sonnet',
      regenerate: false,
    };
  }
  return FORMS[ep.id];
}
function renderDetail() {
  const ep = findEp(selEp);
  if (!ep) { $('#ep-detail').innerHTML = '<div class="empty">Pick an episode.</div>'; return; }
  const f = formFor(ep);
  $('#ep-head').textContent = `${ep.id.toUpperCase()} · ${fmtDate(ep.date)}`;
  const count = Object.values(f.videos).filter(v => v.on && v.ratios.length).length;
  $('#ep-detail').innerHTML = `
    <div class="ep-title">${esc(ep.topic)}</div>
    ${ep.videos.map(v => {
      const st = videoState(ep, v); const fv = f.videos[v.variant];
      const allowed = v.allowed || [];
      const ratios = allowed.length > 1
        ? allowed.map(r => `<button class="small ratio ${fv.ratios.includes(r) ? 'on' : ''}" data-ratio="${esc(v.variant)}|${esc(r)}">${esc(r)}</button>`).join('')
        : `<span class="tag">${esc(allowed[0] || '')}</span>`;
      return `<div class="vid ${fv.on ? '' : 'off'}">
        <input type="checkbox" data-on="${esc(v.variant)}" ${fv.on ? 'checked' : ''} />
        <div style="min-width:0"><div class="name">${esc(VARIANT_LABEL[v.variant] || v.variant)} <small>${esc(v.time || '')}</small></div><div class="ttl" title="${esc(v.title || '')}">${esc(v.title || '')}</div></div>
        <div class="right"><div class="chips">${ratios}</div><span class="st ${st.cls}">${esc(st.text)}</span></div>
      </div>`;
    }).join('')}
    <div class="opts">
      <select id="ep-voice" title="Voice"><option value="elevenlabs">Voice · ElevenLabs</option><option value="macos">Voice · macOS draft (free)</option><option value="openai">Voice · OpenAI</option></select>
      <select id="ep-music" title="Music"><option value="library">Music · from my library</option><option value="generate">Music · generate new</option><option value="off">Music · none</option></select>
    </div>
    <details class="more" ${f.moreOpen ? 'open' : ''}><summary>More options</summary>
      <div class="row"><select id="ep-writer"><option value="claude">Missing script · Claude Code writes it</option><option value="manual">Missing script · stop and tell me</option></select><select id="ep-wmodel" title="Model Claude Code uses to write missing scripts"><option value="sonnet">Writer · Sonnet (uses less of your plan)</option><option value="opus">Writer · Opus (best, uses more)</option><option value="default">Writer · Claude Code default</option></select></div>
      <label class="check"><input type="checkbox" id="ep-redo" ${f.regenerate ? 'checked' : ''} /> Redo: re-read the script .md, then voice, thumbnails and renders again</label>
    </details>
    <div class="savebar"><span title="${esc(f.outDir)}">Saves to ${esc(f.outDir === ep.exportDir ? 'episode folder › exports' : f.outDir)}</span><button class="small" id="ep-choose">Change</button>${f.outDir !== ep.exportDir ? '<button class="small" id="ep-reset">Reset</button>' : ''}</div>
    <button class="primary go" id="ep-go" ${count ? '' : 'disabled'}>Generate ${count} video${count === 1 ? '' : 's'}</button>
    <div class="empty" id="ep-msg" style="min-height:20px">${esc(f.msg || '')}</div>`;
  $('#ep-detail details.more').ontoggle = (e) => { f.moreOpen = e.target.open; };
  $('#ep-voice').value = f.voiceProvider; $('#ep-music').value = f.music; $('#ep-writer').value = f.writer; $('#ep-wmodel').value = f.writerModel; $('#ep-wmodel').disabled = f.writer !== 'claude';
  $$('#ep-detail [data-on]').forEach(cb => cb.onchange = () => { f.videos[cb.dataset.on].on = cb.checked; renderDetail(); });
  $$('#ep-detail [data-ratio]').forEach(b => b.onclick = () => {
    const [variant, r] = b.dataset.ratio.split('|'); const list = f.videos[variant].ratios;
    const i = list.indexOf(r); if (i >= 0) { if (list.length > 1) list.splice(i, 1); } else list.push(r);
    renderDetail();
  });
  const remember = () => store.set('form', {voiceProvider: f.voiceProvider, music: f.music, writer: f.writer, writerModel: f.writerModel});
  $('#ep-voice').onchange = () => { f.voiceProvider = $('#ep-voice').value; remember(); };
  $('#ep-music').onchange = () => { f.music = $('#ep-music').value; remember(); };
  $('#ep-writer').onchange = () => { f.writer = $('#ep-writer').value; $('#ep-wmodel').disabled = f.writer !== 'claude'; remember(); };
  $('#ep-wmodel').onchange = () => { f.writerModel = $('#ep-wmodel').value; remember(); };
  $('#ep-redo').onchange = () => { f.regenerate = $('#ep-redo').checked; };
  $('#ep-choose').onclick = async () => { const dir = await chooseFolder(f.outDir || ep.folder, `Save the videos for ${ep.id.toUpperCase()} to`); if (dir) { f.outDir = dir; renderDetail(); } };
  if ($('#ep-reset')) $('#ep-reset').onclick = () => { f.outDir = ep.exportDir; renderDetail(); };
  $('#ep-go').onclick = () => generate(ep, f);
}
$('#ep-open').onclick = () => { const ep = findEp(selEp); if (ep?.folder) api('/api/open', 'POST', {path: ep.folder}); };
$('#ep-up').onclick = () => setView('upload');
async function generate(ep, f) {
  const videos = Object.entries(f.videos).filter(([, v]) => v.on && v.ratios.length).map(([variant, v]) => ({variant, ratios: v.ratios}));
  if (!videos.length) return;
  $('#ep-go').disabled = true;
  const r = await api('/api/episodes/generate', 'POST', {episodeId: ep.id, videos, outDir: f.outDir, voiceProvider: f.voiceProvider, music: f.music, writer: f.writer, writerModel: f.writerModel, regenerate: f.regenerate});
  f.regenerate = false;
  if ($('#ep-redo')) $('#ep-redo').checked = false;
  f.msg = r.error ? r.error : `Queued: ${r.jobs.map(j => j.title).join(' → ')}`;
  if ($('#ep-msg')) $('#ep-msg').textContent = f.msg;
  if ($('#ep-go')) $('#ep-go').disabled = false;
}
function renderEpisodeJobs() {
  const list = S.jobs.filter(j => j.kind === 'episode' || j.kind === 'speedtest');
  $('#ep-jobs').innerHTML = list.map(j => {
    const pct = Math.round((j.progress || 0) * 100);
    const active = ACTIVE.includes(j.status);
    const running = (j.steps || []).find(s => s.status === 'running');
    const failedStep = (j.steps || []).find(s => s.status === 'failed' && s.detail); // the real reason, in full
    const now = j.render ? `Rendering ${j.render.ratio} · ${Math.round((j.render.progress || 0) * 100)}%${j.render.etaSeconds != null ? ' · ' + fmtTime(j.render.etaSeconds) + ' left' : ''}` : running ? running.label + (running.detail ? ' · ' + running.detail : '…') : j.status === 'queued' ? 'Waiting for the video before it' : '';
    const steps = (j.steps || []).map(st => `<div class="s ${st.status}"><span>${st.status === 'done' ? '✓' : st.status === 'skipped' ? '–' : st.status === 'failed' ? '✗' : st.status === 'running' ? '▸' : '·'} ${esc(st.label)}${st.status === 'notrun' ? ' · not run' : ''}</span><small title="${esc(st.detail || '')}">${esc(st.detail || '')}</small></div>`).join('');

      ${steps ? `<details class="steps" ${j.status === 'failed' ? 'open' : ''}><summary>Steps</summary>${steps}</details>` : ''}
      ${j.exportDir && ['done', 'failed'].includes(j.status) ? `<div class="row" style="margin:8px 0 0"><button class="small" data-openout="${esc(j.exportDir)}">Open folder</button><button class="small" data-details="${esc(j.options?.episodeId || '')}">Upload details</button></div>` : ''}
    </div>`;
  }).join('') || '<div class="empty">Nothing generating.</div>';

function browseModal(start, files, title) {

function classify(file) {
  const name = file.split('/').pop();
  if (/\.(mp4|mov|webm)$/i.test(name)) {
    if (/_youtube|^YouTube_|youtube-1080p/i.test(name)) return {type: 'long', cls: 'long', label: '16:9'};
    if (/_square|_feed|^Feed_/i.test(name)) return {type: 'feed', cls: 'feed', label: /_square/i.test(name) ? '1:1' : '4:5'};
    return {type: 'short', cls: 'short', label: '9:16'};
  }
  if (/\.(jpg|jpeg|png)$/i.test(name)) {
    if (/cover/i.test(name)) return {type: 'thumb', cls: 'img-v', label: 'cover'};
    if (/square/i.test(name)) return {type: 'thumb', cls: 'img-sq', label: 'square'};
    return {type: 'thumb', cls: '', label: 'thumbnail'};
  }
  return {type: 'other', cls: '', label: 'file'};
}

$('#queue-all').onclick = () => { for (const c of S.compositions) { const p = PLATFORM_FOR_COMP[c]; if (p) api('/api/render', 'POST', {compositionId: c, preset: p, frames: $('#frames').value.trim() || null}); } };

// ---------------- modals ----------------
function openPlayer(file) {
  const isVideo = /\.(mp4|mov|webm)$/i.test(file);
  $('#pl-title').textContent = file;
  $('#pl-stage').innerHTML = isVideo ? `<video controls autoplay src="${outUrl(file)}"></video>` : `<img src="${outUrl(file)}" />`;
  $('#pl-dl').href = outUrl(file);
  $('#pl-reveal').onclick = () => api('/api/reveal', 'POST', {file});
  $('#pl-qc').style.display = isVideo ? '' : 'none';
  $('#pl-qc').onclick = () => qcSheets(file);
  $('#player').classList.add('on');
}
// Contact sheets for review: a frame every half second with its time, 24 per image, saved to Downloads.
async function qcSheets(file) {
  const btn = $('#pl-qc');
  const v = document.createElement('video');
  v.muted = true; v.preload = 'auto'; v.src = outUrl(file);
  const once = (ev) => new Promise((ok, bad) => { v.addEventListener(ev, ok, {once: true}); v.addEventListener('error', () => bad(new Error('cannot read the video')), {once: true}); });
  try {
    await once('loadedmetadata');
    const step = 0.5, per = 24, vertical = v.videoHeight >= v.videoWidth;
    const cols = vertical ? 6 : 4, w = vertical ? 270 : 400, h = Math.round((w * v.videoHeight) / v.videoWidth), label = 26;
    const times = [];
    for (let t = 0.05; t < v.duration; t += step) times.push(t);
    const name = file.split('/').pop().replace(/\.[^.]+$/, '');
    const sheets = Math.ceil(times.length / per);
    for (let k = 0; k < sheets; k++) {
      const chunk = times.slice(k * per, (k + 1) * per), rows = Math.ceil(chunk.length / cols);
      const c = document.createElement('canvas'); c.width = cols * w; c.height = rows * (h + label);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#111'; ctx.fillRect(0, 0, c.width, c.height);
      for (const [i, t] of chunk.entries()) {
        btn.textContent = `QC ${k * per + i + 1}/${times.length}`;
        v.currentTime = t; await once('seeked');
        const x = (i % cols) * w, y = Math.floor(i / cols) * (h + label);
        ctx.drawImage(v, x, y + label, w, h);
        ctx.fillStyle = '#FFD23F'; ctx.font = '600 18px ui-monospace, monospace'; ctx.fillText(`${name}  ${t.toFixed(1)} s`, x + 8, y + 19);
      }
      const blob = await new Promise((ok) => c.toBlob(ok, 'image/png'));
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}_qc_${k + 1}-of-${sheets}.png`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    btn.textContent = `Saved ${sheets} sheet${sheets > 1 ? 's' : ''} to Downloads`;
  } catch (e) {
    btn.textContent = 'QC failed: ' + e.message;
  }
  setTimeout(() => { btn.textContent = 'QC frames'; }, 6000);
}
function closePlayer() { $('#pl-stage').innerHTML = ''; $('#player').classList.remove('on'); }
$('#pl-close').onclick = closePlayer;
for (const id of ['player', 'editor-modal', 'analyze-modal', 'publish-modal']) $('#' + id).addEventListener('click', (e) => { if (e.target.id === id) { if (id === 'player') closePlayer(); else $('#' + id).classList.remove('on'); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePlayer(); for (const id of ['editor-modal', 'analyze-modal', 'publish-modal']) $('#' + id).classList.remove('on'); } });
async function openEditor(id) {
  const res = await fetch('/api/scripts/' + encodeURIComponent(id)); const text = await res.text();
  try { $('#editor').value = JSON.stringify(JSON.parse(text), null, 2); } catch { $('#editor').value = text; }
  $('#editor-id').textContent = id; $('#editor-msg').textContent = ''; $('#editor-modal').classList.add('on');
}
$('#save-script').onclick = async () => {
  const id = $('#editor-id').textContent; let body;
  try { body = JSON.parse($('#editor').value); } catch (e) { $('#editor-msg').textContent = 'Invalid JSON: ' + e.message; return; }
  const r = await api('/api/scripts/' + encodeURIComponent(id), 'PUT', body);
  $('#editor-msg').textContent = r.ok ? 'Saved.' : (r.error || 'Not saved');
  if (r.ok) refreshSoon();
};
$('#close-editor').onclick = () => $('#editor-modal').classList.remove('on');
$('#new-script').onclick = () => { $('#an-msg').textContent = ''; $('#analyze-modal').classList.add('on'); };
$('#an-close').onclick = () => $('#analyze-modal').classList.remove('on');
$('#an-run').onclick = async () => {
  const id = $('#an-id').value.trim(); const text = $('#an-text').value;
  if (!id || !text.trim()) { $('#an-msg').textContent = 'videoId and text are required'; return; }
  const r = await fetch('/api/scripts/' + encodeURIComponent(id) + '.md', {method: 'PUT', headers: {'Content-Type': 'text/plain', 'X-Dashboard': '1'}, body: text});
  const j = await r.json().catch(() => ({}));
  if (!j.path) { $('#an-msg').textContent = j.error || 'Could not save the text'; return; }
  await api('/api/tasks', 'POST', {task: 'analyze', options: {videoId: id, pacing: $('#an-pacing').value, voicePreset: $('#an-voice').value, logo: $('#an-logo').value.trim() || undefined, grade: $('#an-grade').value, musicMood: $('#an-music').value || undefined, input: j.path}});
  $('#an-msg').textContent = 'Queued; watch the log.';
};

// ---------------- log + live updates ----------------
function appendLog(e) {
  for (const el of [$('#log'), $('#log2')]) {
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
    const div = document.createElement('div'); div.innerHTML = `<span class="src">${esc(e.source)}</span> ${esc(e.line)}`; el.appendChild(div);
    while (el.children.length > 400) el.removeChild(el.firstChild);
    if (atBottom) el.scrollTop = el.scrollHeight;
  }
}
function renderAll() { renderMachine(); renderSettings(); renderComps(); renderScripts(); renderJobs(); renderOutputs(); renderAutopilot(); renderStudio(); renderEpisodeJobs(); }
function applyState(st) { if (!st || st.error || !st.settings) return; S = st; renderAll(); $('#log').innerHTML = ''; $('#log2').innerHTML = ''; (S.log || []).forEach(appendLog); }
async function refresh() { applyState(await api('/api/state')); }
let soonTimer; function refreshSoon() { clearTimeout(soonTimer); soonTimer = setTimeout(async () => { const st = await api('/api/state'); if (st.error || !st.settings) return; S.scripts = st.scripts; S.compositions = st.compositions; S.queue = st.queue; S.outputs = st.outputs; renderScripts(); renderComps(); renderAutopilot(); renderOutputs(); }, 800); }
const es = new EventSource('/api/events');
es.addEventListener('state', (e) => applyState(JSON.parse(e.data)));
es.addEventListener('machine', (e) => { S.machine = JSON.parse(e.data); renderMachine(); });
let lastDone = -1;
es.addEventListener('jobs', (e) => {
  S.jobs = JSON.parse(e.data); renderJobs(); renderEpisodeJobs();
  const done = S.jobs.filter(j => ['done', 'failed', 'cancelled'].includes(j.status)).length;
  if (done !== lastDone) { lastDone = done; refreshSoon(); }
});
es.addEventListener('outputs', (e) => { S.outputs = JSON.parse(e.data); renderOutputs(); });
es.addEventListener('studio', (e) => { S.studio = JSON.parse(e.data); renderStudio(); });
es.addEventListener('log', (e) => appendLog(JSON.parse(e.data)));
es.addEventListener('plan', (e) => { const p = JSON.parse(e.data); if (p.weeks) { P = p; renderPlan(); if (view === 'upload') loadDetails(); } });

setView(store.get('view', 'episodes'));
loadPlan();
</script>
